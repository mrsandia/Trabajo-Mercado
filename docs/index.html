<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>FitCampus</title>
    <style id="expo-reset">
      html, body { height: 100%; margin: 0; }
      body { overflow: hidden; background: #0D1B2A; }
      #root { display: flex; height: 100%; flex: 1; }
      #error-display {
        display: none;
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: #0D1B2A;
        color: #FF5252;
        padding: 20px;
        font-family: monospace;
        font-size: 13px;
        overflow: auto;
        z-index: 9999;
        white-space: pre-wrap;
        word-break: break-all;
      }
    </style>
  <link rel="icon" href="/Trabajo-Mercado/favicon.ico" /></head>
  <body>
    <div id="error-display"></div>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
      window.onerror = function(msg, src, line, col, err) {
        var d = document.getElementById('error-display');
        d.style.display = 'block';
        d.textContent = 'ERROR:\n' + msg + '\n\nArchivo: ' + src + '\nLínea: ' + line + '\n\n' + (err ? err.stack : '');
      };
      window.addEventListener('unhandledrejection', function(e) {
        var d = document.getElementById('error-display');
        d.style.display = 'block';
        d.textContent = (d.textContent || '') + '\nPromise Error:\n' + (e.reason ? (e.reason.stack || e.reason) : e);
      });
    </script>
  <script src="/Trabajo-Mercado/_expo/static/js/web/index-30afdcd16697065806dfff08ebba1067.js" defer></script>
</body>
</html>
